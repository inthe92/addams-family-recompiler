name: Build content-free frontends

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Native verification scope (push/PR still run all platforms)
        type: choice
        options: [all, windows]
        default: all

permissions:
  contents: read

jobs:
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit source export
        id: source_audit
        run: python3 -B tools/public/audit_public.py .
      - name: Build engine without ROM
        id: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNES_ENABLE_DESKTOP=ON -DNES_ENABLE_MODS=ON -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build --parallel 3
          ctest --test-dir build --show-only=json-v1 > build/ctest-inventory.json
          python3 -B tests/verify_ctest_suite.py --inventory build/ctest-inventory.json
      - name: Run complete CTest suite
        run: |
          ctest --test-dir build --output-on-failure --verbose --no-tests=error --test-output-size-passed 65536 --test-output-size-failed 65536 --output-junit "$PWD/build/ctest-results.xml"
      - name: Validate executed tests and JUnit
        if: always()
        run: python3 -B tests/verify_ctest_suite.py --inventory build/ctest-inventory.json --junit build/ctest-results.xml
      - name: Check eligibility for diagnostic packages
        id: package_eligibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -B tests/mod_package_eligibility.py --inventory build/ctest-inventory.json --junit build/ctest-results.xml --output build/mod-package-eligibility.json
      - name: Verify experimental Mod Manager with native OpenGL
        id: manager_gl
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 -B tools/mods/make_phase5_examples.py build/mod-manager-zips
          python3 -B tools/mods/make_completion_example.py build/mod-manager-zips/Configurable-Jump-Example-v1.0.zip
          build/mod_completion02_gl_checks "$RUNNER_TEMP/mod-manager-gl" build/mod-manager-zips > build/mod-manager-gl.log 2>&1
      - name: Collect high refresh evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -B tests/high_refresh_report.py --build build --output build/high-refresh-evidence.json --expected-commit "${{ github.sha }}" --graphics run --graphics-label macos-native-runner
      - name: Preserve test verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.os }}
          path: |
            build/high-refresh-evidence.json
            build/high-refresh-gl.log
            build/mod-manager-gl.log
            build/ctest-inventory.json
            build/ctest-results.xml
            build/mod-package-eligibility.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Bundle verified local importer tools
        id: toolchain
        # A02 remains a failing gate; independent package checks still run.
        if: ${{ !cancelled() && steps.source_audit.outcome == 'success' && steps.build.outcome == 'success' && steps.package_eligibility.outcome == 'success' && steps.manager_gl.outcome == 'success' }}
        run: |
          if [ "$(uname -m)" = "arm64" ]; then TARGET=macos-arm64; else TARGET=macos-x86_64; fi
          python3 -B tools/public/fetch_runtime_tools.py --destination runtime-tools --cache /tmp/nes-runtime-cache --system "$TARGET"
          mkdir -p /tmp/nes-smoke/game
          cp -R include /tmp/nes-smoke/include
          cp -R game/include /tmp/nes-smoke/game/include
          for header in include/recomp/module_abi.h include/recomp/runtime_services.h include/recomp/cpu_state.h game/include/game/compiled_program.h; do
            if [ ! -f "/tmp/nes-smoke/$header" ]; then
              echo "Missing ABI v3 smoke-test header: $header" >&2
              exit 1
            fi
          done
          cp -R tools /tmp/nes-smoke/tools
          cp -R runtime-tools /tmp/nes-smoke/toolchain
          runtime-tools/python/bin/python3 -B tests/public_toolchain_smoke.py /tmp/nes-smoke
          runtime-tools/python/bin/python3 -B tests/public_import_process_checks.py /tmp/nes-smoke build/import_probe
          python3 -B tests/macos_lipo_checks.py
      - name: Package frontend without imported content
        id: package
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: python3 -B tools/public/package_platform.py --build build --output dist --toolchain runtime-tools 2>&1 | tee build/macos-package.log
      - name: Verify extracted package on native macOS 15
        id: package_checks
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python3 -B tests/macos_package_checks.py --build build --output dist --arch ${{ matrix.arch }} --report build/macos-package-verification.json --require-native-macos15 --expected-commit "${{ github.sha }}"
      - name: Preserve package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-verification-${{ matrix.arch }}
          path: |
            build/macos-package.log
            build/macos-package-verification.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package_checks.outcome == 'success' }}
        with:
          name: mod-manager-beta-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: build_python
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Build identity needs the runner's Git for Windows, absent from minimal PATH.
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Pin build Python and UTF-8 text I/O
        run: |
          echo "CI_PYTHON=${{ steps.build_python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
      - name: Audit source export
        id: source_audit
        run: |
          "$CI_PYTHON" -B tools/public/audit_public.py .
      - name: Build engine without ROM
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNES_ENABLE_DESKTOP=ON -DNES_ENABLE_MODS=ON -DPython3_EXECUTABLE="$CI_PYTHON"
          cmake --build build --parallel 4
          "$CI_PYTHON" -B -c 'import json,os,sys; from pathlib import Path; sys.path.insert(0,"tools/public"); from build_identity import validate; data=json.loads(Path("build/native-build-info.json").read_text()); print(json.dumps(data,sort_keys=True)); validate(data,os.environ["GITHUB_SHA"])'
          ctest --test-dir build --show-only=json-v1 > build/ctest-inventory.json
          "$CI_PYTHON" -B tests/verify_ctest_suite.py --inventory build/ctest-inventory.json
      - name: Run complete CTest suite
        run: |
          ctest --test-dir build --output-on-failure --verbose --no-tests=error --test-output-size-passed 65536 --test-output-size-failed 65536 --output-junit "$PWD/build/ctest-results.xml"
      - name: Validate executed tests and JUnit
        if: always()
        run: |
          "$CI_PYTHON" -B tests/verify_ctest_suite.py --inventory build/ctest-inventory.json --junit build/ctest-results.xml
      - name: Check eligibility for diagnostic packages
        id: package_eligibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          "$CI_PYTHON" -B tests/mod_package_eligibility.py --inventory build/ctest-inventory.json --junit build/ctest-results.xml --output build/mod-package-eligibility.json
      - name: Collect high refresh evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Hosted Windows desktop/GL 3.2 capability has not been established.
        # Native deterministic contracts run in CTest; physical GL remains manual.
        run: |
          "$CI_PYTHON" -B tests/high_refresh_report.py --build build --output build/high-refresh-evidence.json --expected-commit "${{ github.sha }}" --graphics not-executed --graphics-label windows-hosted-display-unverified
      - name: Preserve test verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-windows-x64
          path: |
            build/native-build-info.json
            build/examples/mods/*.zip
            build/high-refresh-evidence.json
            build/high-refresh-gl.log
            build/mod-manager-gl.log
            build/ctest-inventory.json
            build/ctest-results.xml
            build/mod-package-eligibility.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Bundle verified local importer tools
        id: toolchain
        # Keep A02 failed; independently verify the portable package.
        if: ${{ !cancelled() && steps.source_audit.outcome == 'success' && steps.build.outcome == 'success' && steps.package_eligibility.outcome == 'success' }}
        run: |
          "$CI_PYTHON" -B tools/public/fetch_runtime_tools.py --destination runtime-tools --cache runtime-cache --system windows-x86_64
      - name: Package portable frontend
        id: package
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -o pipefail
          "$CI_PYTHON" -B tools/public/package_platform.py --build build --output dist --toolchain runtime-tools 2>&1 | tee build/windows-package.log
      - name: Verify extracted portable Windows package
        id: package_checks
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          "$CI_PYTHON" -B tests/windows_package_checks.py --self-test
          "$CI_PYTHON" -B tests/windows_package_checks.py --build build --output dist --report build/windows-package-verification.json --expected-commit "${{ github.sha }}"
      - name: Preserve Windows package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-verification-x86_64
          path: |
            build/windows-package.log
            build/windows-package-verification.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package_checks.outcome == 'success' }}
        with:
          name: mod-manager-beta-windows-x86_64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 libgl1-mesa-dev libgl1-mesa-dri xvfb xauth libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Audit source export
        id: source_audit
        run: python3 -B tools/public/audit_public.py .
      - name: Build engine without ROM
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNES_ENABLE_DESKTOP=ON -DNES_ENABLE_MODS=ON
          cmake --build build --parallel 4
          ctest --test-dir build --show-only=json-v1 > build/ctest-inventory.json
          python3 -B tests/verify_ctest_suite.py --inventory build/ctest-inventory.json
      - name: Run complete CTest suite
        id: ctest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --verbose --no-tests=error --test-output-size-passed 65536 --test-output-size-failed 65536 --output-junit "$PWD/build/ctest-results.xml"
      - name: Validate executed tests and JUnit
        if: always()
        run: python3 -B tests/verify_ctest_suite.py --inventory build/ctest-inventory.json --junit build/ctest-results.xml
      - name: Check eligibility for diagnostic packages
        id: package_eligibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -B tests/mod_package_eligibility.py --inventory build/ctest-inventory.json --junit build/ctest-results.xml --output build/mod-package-eligibility.json
      - name: Verify experimental Mod Manager with Mesa/Xvfb OpenGL
        id: manager_gl
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 -B tools/mods/make_phase5_examples.py build/mod-manager-zips
          python3 -B tools/mods/make_completion_example.py build/mod-manager-zips/Configurable-Jump-Example-v1.0.zip
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 build/mod_completion02_gl_checks "$RUNNER_TEMP/mod-manager-gl" build/mod-manager-zips > build/mod-manager-gl.log 2>&1
      - name: Collect high refresh evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Native Linux process, Mesa software GL and virtual X display: no scanout.
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python3 -B tests/high_refresh_report.py --build build --output build/high-refresh-evidence.json --expected-commit "${{ github.sha }}" --graphics run --graphics-label linux-xvfb-mesa
      - name: Preserve test verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux-x64
          path: |
            build/high-refresh-evidence.json
            build/high-refresh-gl.log
            build/mod-manager-gl.log
            build/ctest-inventory.json
            build/ctest-results.xml
            build/mod-package-eligibility.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Bundle verified local importer tools
        id: toolchain
        if: ${{ !cancelled() && steps.source_audit.outcome == 'success' && steps.build.outcome == 'success' && steps.package_eligibility.outcome == 'success' && steps.manager_gl.outcome == 'success' }}
        run: |
          python3 -B tools/public/fetch_runtime_tools.py --destination runtime-tools --cache /tmp/nes-runtime-cache --system linux-x86_64
          mkdir -p /tmp/nes-smoke/game
          cp -R include /tmp/nes-smoke/include
          cp -R game/include /tmp/nes-smoke/game/include
          for header in include/recomp/module_abi.h include/recomp/runtime_services.h include/recomp/cpu_state.h game/include/game/compiled_program.h; do
            if [ ! -f "/tmp/nes-smoke/$header" ]; then
              echo "Missing ABI v3 smoke-test header: $header" >&2
              exit 1
            fi
          done
          cp -R tools /tmp/nes-smoke/tools
          cp -R runtime-tools /tmp/nes-smoke/toolchain
          runtime-tools/python/bin/python3 -B tests/public_toolchain_smoke.py /tmp/nes-smoke
          runtime-tools/python/bin/python3 -B tests/public_import_process_checks.py /tmp/nes-smoke build/import_probe
      - name: Download official packaging tools
        id: packaging_tools
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          mkdir -p /tmp/nes-packaging
          curl --fail --location https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -o /tmp/nes-packaging/linuxdeploy
          curl --fail --location https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o /tmp/nes-packaging/appimagetool
          chmod +x /tmp/nes-packaging/linuxdeploy /tmp/nes-packaging/appimagetool
          sha256sum /tmp/nes-packaging/* > packaging-tools-sha256.txt
      - name: Generate AppImage
        id: package
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.packaging_tools.outcome == 'success' }}
        env:
          LINUXDEPLOY: /tmp/nes-packaging/linuxdeploy
          APPIMAGETOOL: /tmp/nes-packaging/appimagetool
          ARCH: x86_64
        run: sh tools/public/package_linux.sh build
      - name: Verify Linux AppImage on native runner
        id: package_checks
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python3 -B tests/linux_appimage_checks.py --build build --output dist --report build/linux-appimage-verification.json --expected-commit "${{ github.sha }}"
      - name: Preserve Linux AppImage verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-verification
          path: build/linux-appimage-verification.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package_checks.outcome == 'success' }}
        with:
          name: mod-manager-beta-linux-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            packaging-tools-sha256.txt
          if-no-files-found: error
